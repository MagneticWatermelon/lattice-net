[package]
name = "lattice-net"
version = "0.1.0"
edition = "2021"
description = "Custom UDP transport for a large-scale MMOFPS: acks, reliable-ordered + unreliable channels, connect tokens, ChaCha20-Poly1305. Sans-IO."
license = "MIT"

[dependencies]
# The one dependency: ChaCha20-Poly1305 and OS randomness. ring's AEAD is BoringSSL's
# assembly: 0.17 us to open a 60 B packet vs 0.43 us for RustCrypto's (which cost
# 10k clients a ladder level on the WSL box). Builds C/asm, so it needs a C toolchain.
ring = "0.17"

[profile.release]
debug = 1

[workspace]
members = [".", "game", "client-core", "sim"]
default-members = [".", "game", "client-core", "sim"]
