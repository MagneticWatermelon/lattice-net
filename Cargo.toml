[package]
name = "lattice-net"
version = "0.1.0"
edition = "2021"
description = "Custom UDP transport for a large-scale MMOFPS: acks, reliable-ordered + unreliable channels, connect tokens, ChaCha20-Poly1305. Sans-IO."
license = "MIT"

[dependencies]
# The one dependency: audited AEADs (RustCrypto, NCC Group audit), plus OS randomness for keys.
chacha20poly1305 = "0.10"

[profile.release]
debug = 1

[workspace]
members = [".", "sim"]
default-members = [".", "sim"]
