[package]
name = "lattice-sim"
version = "0.1.0"
edition = "2021"
description = "M1 headless scale test: movement-only authoritative server, bot swarm, per-phase tick metrics."
license = "MIT"
publish = false

[dependencies]
lattice-net = { path = ".." }
lattice-game = { path = "../game" }
lattice-client-core = { path = "../client-core" }
rayon = "1"
socket2 = { version = "0.5", features = ["all"] } # all: SO_REUSEPORT

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
