# The shared rules must give the same bits on every platform: the Linux
# server and the Windows client run the same movement, and prediction is
# checked bit for bit (scripts/determinism.sh). Basic arithmetic and sqrt are
# exact under IEEE 754, but each platform's math library computes sin, cos,
# powf and the rest its own way, so those go through the `libm` crate.
disallowed-methods = [
  { path = "f32::sin", reason = "use libm::sinf: the same bits on every platform" },
  { path = "f32::cos", reason = "use libm::cosf: the same bits on every platform" },
  { path = "f32::tan", reason = "use libm::tanf: the same bits on every platform" },
  { path = "f32::sin_cos", reason = "use libm::sincosf: the same bits on every platform" },
  { path = "f32::asin", reason = "use libm::asinf: the same bits on every platform" },
  { path = "f32::acos", reason = "use libm::acosf: the same bits on every platform" },
  { path = "f32::atan", reason = "use libm::atanf: the same bits on every platform" },
  { path = "f32::atan2", reason = "use libm::atan2f: the same bits on every platform" },
  { path = "f32::exp", reason = "use libm::expf: the same bits on every platform" },
  { path = "f32::exp2", reason = "use libm::exp2f: the same bits on every platform" },
  { path = "f32::ln", reason = "use libm::logf: the same bits on every platform" },
  { path = "f32::log2", reason = "use libm::log2f: the same bits on every platform" },
  { path = "f32::log10", reason = "use libm::log10f: the same bits on every platform" },
  { path = "f32::powf", reason = "use libm::powf: the same bits on every platform" },
  { path = "f32::powi", reason = "multiply, or libm::powf: the same bits on every platform" },
  { path = "f32::hypot", reason = "use libm::hypotf: the same bits on every platform" },
  { path = "f32::cbrt", reason = "use libm::cbrtf: the same bits on every platform" },
  { path = "f64::sin", reason = "use libm::sin: the same bits on every platform" },
  { path = "f64::cos", reason = "use libm::cos: the same bits on every platform" },
  { path = "f64::tan", reason = "use libm::tan: the same bits on every platform" },
  { path = "f64::sin_cos", reason = "use libm::sincos: the same bits on every platform" },
  { path = "f64::asin", reason = "use libm::asin: the same bits on every platform" },
  { path = "f64::acos", reason = "use libm::acos: the same bits on every platform" },
  { path = "f64::atan", reason = "use libm::atan: the same bits on every platform" },
  { path = "f64::atan2", reason = "use libm::atan2: the same bits on every platform" },
  { path = "f64::exp", reason = "use libm::exp: the same bits on every platform" },
  { path = "f64::exp2", reason = "use libm::exp2: the same bits on every platform" },
  { path = "f64::ln", reason = "use libm::log: the same bits on every platform" },
  { path = "f64::log2", reason = "use libm::log2: the same bits on every platform" },
  { path = "f64::log10", reason = "use libm::log10: the same bits on every platform" },
  { path = "f64::powf", reason = "use libm::pow: the same bits on every platform" },
  { path = "f64::powi", reason = "multiply, or libm::pow: the same bits on every platform" },
  { path = "f64::hypot", reason = "use libm::hypot: the same bits on every platform" },
  { path = "f64::cbrt", reason = "use libm::cbrt: the same bits on every platform" },
]
